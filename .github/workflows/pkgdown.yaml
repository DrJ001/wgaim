# Deploy pkgdown site to GitHub Pages.
#
# Vignettes that require ASReml-R (a commercial package) are pre-built
# locally and stored in inst/doc/.  The workflow copies the pre-built HTML
# into docs/articles/ before running pkgdown so that build_site(lazy = TRUE)
# sees an output file newer than the source and skips re-rendering.
#
# Triggers: every push to main, or manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: any::pkgdown, local::.

      # Pre-populate docs/articles/ with the pre-built vignette HTML so that
      # pkgdown's lazy mode skips re-rendering (which would fail without ASReml-R).
      # The `touch` call ensures the output timestamp is newer than the source.
      - name: Seed pre-built articles
        run: |
          mkdir -p docs/articles
          cp inst/doc/qtlAim_pipeline.html docs/articles/qtlAim_pipeline.html
          touch docs/articles/qtlAim_pipeline.html

      - name: Build pkgdown site
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install     = FALSE,
            lazy        = TRUE
          )
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
