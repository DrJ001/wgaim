# Deploy pkgdown site to GitHub Pages.
#
# Vignettes that require ASReml-R (a commercial package) are pre-built
# locally and stored in inst/doc/.  To avoid pkgdown trying to re-render
# them (which would fail without ASReml-R), we:
#   1. Call init_site() to create the docs/ directory with pkgdown's marker.
#   2. Copy the pre-built HTML into docs/articles/ and touch it so its
#      timestamp is newer than the source .qmd.
#   3. Call individual build functions (no clean_site()) so the seeded
#      HTML survives and build_articles(lazy=TRUE) skips re-rendering.
#
# Triggers: every push to main, or manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: any::pkgdown, local::.

      - name: Initialise pkgdown site structure
        run: pkgdown::init_site()
        shell: Rscript {0}

      # Copy pre-built vignette HTML into docs/articles/ AFTER init_site()
      # has created the directory structure, then touch it so its timestamp
      # is newer than the source .qmd — this is what lazy=TRUE checks.
      - name: Seed pre-built articles
        run: |
          mkdir -p docs/articles
          cp inst/doc/qtlAim_pipeline.html docs/articles/qtlAim_pipeline.html
          touch docs/articles/qtlAim_pipeline.html
          cp inst/doc/qtlAim_mv_pipeline.html docs/articles/qtlAim_mv_pipeline.html
          touch docs/articles/qtlAim_mv_pipeline.html
          cp inst/doc/gwasAim_pipeline.html docs/articles/gwasAim_pipeline.html
          touch docs/articles/gwasAim_pipeline.html

      # Build each section individually — deliberately avoiding
      # build_site_github_pages() which calls clean_site() and would
      # delete the pre-seeded HTML before lazy=TRUE could skip it.
      - name: Build pkgdown site
        run: |
          pkgdown::build_home()
          pkgdown::build_reference()
          pkgdown::build_articles(lazy = TRUE)
          if (file.exists("NEWS.md")) pkgdown::build_news()
          writeLines("", "docs/.nojekyll")
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
